<!doctype html>
<html lang="en" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahbi</title>
<link rel="icon" href="/web/icon.svg">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('sahbi-theme') || 'gold' } catch {}</script>
<style>
/* ======================= THEMES ======================= */
:root,[data-theme="gold"]{
  --name:"Sahara Gold";
  --bg:#06070a; --glow1:rgba(240,180,76,.16); --glow2:rgba(108,182,255,.08);
  --glass:rgba(22,24,31,.62); --glass2:rgba(30,33,42,.72); --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#ecebe8; --dim:#8d929c; --faint:#5b606a;
  --accent:#f0b44c; --accent2:#ffd892; --accent3:#9a5a0c; --on-accent:#1d1304;
  --listen:#6cb6ff; --think:#a78bfa; --ok:#4ade80; --bad:#f87171;
  --me1:#25385a; --me2:#1c2b47; --meline:#33507e; --metext:#eef3ff;
  --ai1:rgba(34,37,47,.78); --ai2:rgba(26,28,36,.78);
  --particle:255,214,150;
  --orb-idle:#ffd892 #f0b44c #7a4306; --orb-listen:#cfe6ff #6cb6ff #1b3e78; --orb-think:#e3d6ff #a78bfa #3d2a7a; --orb-speak:#fff0c8 #ffc65c #8a4b05;
  --map:#f0b44c #6cb6ff #4ade80 #f472b6 #a78bfa #fb923c #22d3ee #facc15 #f87171 #94a3b8;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --display:"Segoe UI Variable Display","Segoe UI",sans-serif;
}
[data-theme="neon"]{
  --name:"Neon Tokyo";
  --bg:#05040d; --glow1:rgba(255,43,214,.16); --glow2:rgba(34,227,255,.12);
  --glass:rgba(20,14,38,.6); --glass2:rgba(28,18,52,.72); --line:rgba(190,140,255,.12); --line2:rgba(255,120,240,.25);
  --text:#f3ecff; --dim:#a596c9; --faint:#6a5b8f;
  --accent:#ff2bd6; --accent2:#ff9cf0; --accent3:#5b0a6e; --on-accent:#16001a;
  --listen:#22e3ff; --think:#9d6bff; --ok:#39ffb6; --bad:#ff4b6e;
  --me1:#0f3b52; --me2:#0b2238; --meline:#22e3ff66; --metext:#e6fbff;
  --ai1:rgba(44,18,64,.72); --ai2:rgba(24,12,44,.72);
  --particle:120,240,255;
  --orb-idle:#ffd1f5 #ff2bd6 #4a0a5e; --orb-listen:#d4fbff #22e3ff #063f5c; --orb-think:#e2d4ff #9d6bff #2a1068; --orb-speak:#ffe3fa #ff5ce0 #6b0c7a;
  --map:#ff2bd6 #22e3ff #b14bff #39ffb6 #ffe14b #ff6b3d #4b7bff #ff4b8b #7dff4b #c7c7ff;
}
[data-theme="aurora"]{
  --name:"Aurora";
  --bg:#020d10; --glow1:rgba(52,245,197,.14); --glow2:rgba(139,123,255,.14);
  --glass:rgba(10,30,36,.58); --glass2:rgba(14,40,48,.7); --line:rgba(140,255,230,.09); --line2:rgba(140,255,230,.2);
  --text:#e6fffa; --dim:#8fb8b2; --faint:#55807a;
  --accent:#34f5c5; --accent2:#b6fff0; --accent3:#0b4a5a; --on-accent:#002019;
  --listen:#4fc3ff; --think:#8b7bff; --ok:#5effa1; --bad:#ff7a8a;
  --me1:#2b2466; --me2:#1b1846; --meline:#8b7bff66; --metext:#f1eeff;
  --ai1:rgba(12,46,52,.72); --ai2:rgba(8,30,36,.72);
  --particle:160,255,230;
  --orb-idle:#d6fff4 #34f5c5 #0b4a5a; --orb-listen:#d9f2ff #4fc3ff #0b3a66; --orb-think:#e4e0ff #8b7bff #2a2170; --orb-speak:#e8fffb #6bffd9 #0d5c55;
  --map:#34f5c5 #8b7bff #4fc3ff #c4ff5e #ff8ad8 #5effa1 #ffd36b #6be4ff #b49bff #9ef0e0;
}
[data-theme="frost"]{
  --name:"Frost";
  --bg:#eef2f8; --glow1:rgba(91,140,255,.22); --glow2:rgba(226,69,154,.10);
  --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.82); --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.16);
  --text:#0f1726; --dim:#5b6475; --faint:#97a0b0;
  --accent:#2f6bff; --accent2:#8fb0ff; --accent3:#16328c; --on-accent:#ffffff;
  --listen:#0ea5e9; --think:#7c3aed; --ok:#10a37f; --bad:#dc2626;
  --me1:#2f6bff; --me2:#2457d6; --meline:#2f6bff; --metext:#ffffff;
  --ai1:rgba(255,255,255,.92); --ai2:rgba(246,248,252,.92);
  --particle:47,107,255;
  --orb-idle:#e6efff #5b8cff #1a3b9c; --orb-listen:#e0f6ff #0ea5e9 #075985; --orb-think:#efe6ff #8b5cf6 #3b1a8a; --orb-speak:#eaf1ff #4f7dff #18308a;
  --map:#2f6bff #e2459a #10a37f #f08c00 #7c3aed #0891b2 #dc2626 #65a30d #db2777 #475569;
}
[data-theme="matrix"]{
  --name:"Matrix";
  --bg:#000402; --glow1:rgba(57,255,136,.12); --glow2:rgba(0,255,163,.06);
  --glass:rgba(4,20,10,.62); --glass2:rgba(6,28,14,.74); --line:rgba(57,255,136,.12); --line2:rgba(57,255,136,.28);
  --text:#c9ffd9; --dim:#5fae7c; --faint:#2f6b45;
  --accent:#39ff88; --accent2:#c6ffd9; --accent3:#0a4d22; --on-accent:#001a09;
  --listen:#5cffd6; --think:#a3ff5c; --ok:#39ff88; --bad:#ff5c5c;
  --me1:#0a3a1c; --me2:#062a13; --meline:#39ff8866; --metext:#d8ffe5;
  --ai1:rgba(6,26,13,.8); --ai2:rgba(3,16,8,.8);
  --particle:57,255,136;
  --orb-idle:#ccffe0 #39ff88 #0a4d22; --orb-listen:#d4fff5 #5cffd6 #0a4d44; --orb-think:#eaffd4 #a3ff5c #2f5a0a; --orb-speak:#e0ffe9 #6dffa6 #0d5e2c;
  --map:#39ff88 #00d26a #a3ff5c #5cffd6 #c6ff9e #1fbf6b #7dffb2 #e0ff4a #00ffa3 #9dffc9;
  --font:"Cascadia Code","Consolas",monospace; --display:"Cascadia Code","Consolas",monospace;
}
[data-theme="sunset"]{
  --name:"Atlas Sunset";
  --bg:#0d0608; --glow1:rgba(255,122,69,.18); --glow2:rgba(255,61,127,.12);
  --glass:rgba(36,16,20,.6); --glass2:rgba(48,20,26,.72); --line:rgba(255,170,140,.1); --line2:rgba(255,150,120,.24);
  --text:#fff1ea; --dim:#c49a8f; --faint:#7d5a52;
  --accent:#ff7a45; --accent2:#ffd0b0; --accent3:#7a1d1d; --on-accent:#200800;
  --listen:#ffc24b; --think:#ff3d7f; --ok:#7dffb2; --bad:#ff5e5e;
  --me1:#5a1530; --me2:#3a0d20; --meline:#ff3d7f66; --metext:#ffeef4;
  --ai1:rgba(52,22,26,.74); --ai2:rgba(34,14,18,.74);
  --particle:255,170,120;
  --orb-idle:#ffe0c2 #ff7a45 #7a1d1d; --orb-listen:#fff1c9 #ffc24b #7a4a05; --orb-think:#ffd6e5 #ff3d7f #6b0c33; --orb-speak:#fff0e0 #ff9a5c #8a2a12;
  --map:#ff7a45 #ff3d7f #ffc24b #c45bff #ff9e7a #ff5e5e #ffd98a #e86bff #ff8f3d #f5a3b3;
}

/* ======================= BASE ======================= */
:root{--r:18px; --ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);overflow:hidden;transition:background .6s var(--ease),color .4s}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
#bgfx{position:fixed;inset:0;z-index:0}
.app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;height:100%;max-width:1360px;margin:0 auto;padding:20px}
@media(max-width:920px){.app{grid-template-columns:1fr;padding:12px}.side{display:none}}
.main{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:2px 4px 0;position:relative;z-index:5}
.brand{font:600 20px/1 var(--display);letter-spacing:.3px;white-space:nowrap}
.brand b{background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:4px 10px;backdrop-filter:blur(10px);white-space:nowrap}
@media(max-width:1100px){.chip{display:none}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.warn .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.sp{flex:1}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--text);cursor:pointer;transition:.25s var(--ease);backdrop-filter:blur(10px)}
.iconbtn:hover{border-color:var(--line2);transform:translateY(-1px)}
.iconbtn.active{background:color-mix(in srgb,var(--accent) 22%,var(--glass));border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent2)}
.iconbtn svg{width:18px;height:18px}

/* theme picker */
.themes{position:absolute;right:0;top:48px;width:min(460px,92vw);background:var(--glass2);border:1px solid var(--line2);border-radius:20px;padding:14px;backdrop-filter:blur(22px);box-shadow:0 20px 60px #0008;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.35s var(--ease)}
.themes.open{opacity:1;transform:none;pointer-events:auto}
.themes h4{grid-column:1/-1;margin:2px 4px 2px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.sw{border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;background:none;color:var(--text);font:inherit;font-size:12.5px;text-align:left;transition:.25s var(--ease)}
.sw:hover{transform:translateY(-2px);border-color:var(--line2)}
.sw.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.sw i{display:block;height:54px;border-radius:10px;margin-bottom:7px;position:relative;overflow:hidden}
.sw i::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;right:9px;bottom:9px;background:var(--o);box-shadow:0 0 16px var(--og)}

/* orb */
.stage{position:relative;height:250px;flex:none;display:grid;place-items:center;transition:height .6s var(--ease)}
.app.chatting .stage{height:170px}
#orb{width:250px;height:250px;cursor:pointer;transition:transform .5s var(--ease)}
.app.chatting #orb{transform:scale(.72)}
.status{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);transition:.3s}
.status b{color:var(--accent)}

/* conversation bubbles */
#log{flex:1;overflow-y:auto;padding:8px 6px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;mask-image:linear-gradient(to bottom,transparent 0,#000 24px)}
#log>*{flex-shrink:0}
#log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.msg{position:relative;max-width:min(78%,680px);padding:11px 16px;border-radius:22px;word-wrap:break-word;animation:pop .45s var(--ease) both;backdrop-filter:blur(14px)}
.me{align-self:flex-end;color:var(--metext);background:linear-gradient(135deg,var(--me1),var(--me2));border:1px solid var(--meline);border-bottom-right-radius:7px;
  box-shadow:0 8px 24px -10px color-mix(in srgb,var(--me1) 80%,transparent),inset 0 1px 0 #ffffff22}
.ai{align-self:flex-start;background:linear-gradient(160deg,var(--ai1),var(--ai2));border:1px solid var(--line);border-bottom-left-radius:7px;
  box-shadow:0 10px 30px -18px #000c,inset 0 1px 0 #ffffff10}
.ai::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(var(--accent2),var(--accent));opacity:.85}
.ai p{margin:0 0 6px}.ai p:last-child{margin:0}.ai ul{margin:4px 0;padding-left:20px}.ai a{color:var(--listen)}
.ai code{background:color-mix(in srgb,var(--text) 9%,transparent);padding:1px 5px;border-radius:6px;font-size:13px}
.ai b{color:color-mix(in srgb,var(--accent2) 60%,var(--text))}
.caret::after{content:"";display:inline-block;width:7px;height:15px;margin-left:3px;vertical-align:-2px;background:var(--accent);border-radius:2px;animation:blink 1s steps(2) infinite}
.voice{font-size:11px;opacity:.7;margin-left:6px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--ai1);border:1px solid var(--line);border-radius:22px;animation:pop .3s var(--ease)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.act{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);background:color-mix(in srgb,var(--text) 3%,transparent);border:1px solid var(--line);border-radius:12px;padding:6px 11px;animation:pop .4s var(--ease) both;max-width:90%}
.act .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);flex:none;font-size:12px}
.act b{color:var(--text);font-weight:600;white-space:nowrap}
.act span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.busy span:last-child{animation:shimmer 1.4s infinite}

/* cards in the conversation */
.mail,.brief,.list{align-self:flex-start;width:min(600px,94%);border-radius:var(--r);animation:pop .5s var(--ease) both;position:relative;overflow:hidden;backdrop-filter:blur(14px)}
.mail{background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:14px 16px}
.mail .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.mail .to{font-size:13px;color:var(--dim)} .mail .to b{color:var(--text);font-weight:600}
.mail .subj{font-weight:600;margin-bottom:4px}
.mail .body{font-size:13.5px;color:var(--dim);white-space:pre-wrap;max-height:130px;overflow:auto;padding-right:4px}
.mail .files{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mail .file{font-size:12px;background:color-mix(in srgb,var(--text) 6%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.mail .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));width:100%;transform-origin:left}
.mail .row{display:flex;align-items:center;gap:10px;margin-top:10px}
.count{font-size:13px;color:var(--dim)}
.btn{border:1px solid var(--line2);background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text);border-radius:10px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.mail.sent{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.mail.sent .badge{color:var(--ok)}
.mail.cancelled{opacity:.55;border-color:var(--line)}.mail.cancelled .badge{color:var(--dim)}
.mail.failed{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.mail.failed .badge{color:var(--bad)}
.brief{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--glass2)),var(--glass));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);padding:13px 16px}
.brief p{margin:0}
.lh{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.list{background:var(--glass2);border:1px solid var(--line);padding:12px 12px 6px}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-top:1px solid var(--line);color:var(--text);text-decoration:none;border-radius:10px;transition:background .2s}
.li:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}.list .lh+.li{border-top:0}
.li .n{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--dim)}
.li small{color:var(--dim)} .li .sn{display:block;color:var(--faint);margin-top:2px}
.li div{flex:1;min-width:0;font-size:13.5px}
.fit{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.fhi{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.fmid{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}.flo{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--dim)}

/* composer */
.composer{flex:none;margin-top:6px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:6px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(16px);transition:.3s var(--ease)}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.composer input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:10px 12px}
.composer input::placeholder{color:var(--faint)}
.mic{width:42px;height:42px;border-radius:16px;border:0;display:grid;place-items:center;cursor:pointer;background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text);transition:.25s var(--ease)}
.mic:hover{background:color-mix(in srgb,var(--text) 12%,transparent)}
.mic.live{background:var(--listen);color:#fff;box-shadow:0 0 22px var(--listen)}
.send{width:42px;height:42px;border-radius:16px;border:0;display:grid;place-items:center;cursor:pointer;color:var(--on-accent);background:linear-gradient(135deg,var(--accent2),var(--accent));transition:.25s var(--ease)}
.send:hover{transform:scale(1.05)}
.mic svg,.send svg{width:19px;height:19px}
.chips{flex:none;display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:13px;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:7px 13px;cursor:pointer;transition:.25s var(--ease);backdrop-filter:blur(10px)}
.chips button:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);transform:translateY(-2px)}

/* side */
.side{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:4px;scrollbar-width:none}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;backdrop-filter:blur(16px);animation:pop .6s var(--ease) both}
.card h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.clock{font:300 44px/1 var(--display);letter-spacing:-1px}
.day{color:var(--dim);font-size:13px;margin-top:6px;text-transform:capitalize}
.wx{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.wx .t{font-size:22px;font-weight:600}.wx .s{font-size:13px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px}
.kv span:first-child{color:var(--dim)}
.up{color:var(--ok)}.down{color:var(--bad)}
.meter{height:5px;background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:5px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;transition:width 1s var(--ease)}
.news{list-style:none;margin:0;padding:0}
.news li{font-size:13px;color:var(--dim);padding:7px 0;border-top:1px solid var(--line);line-height:1.4}
.news li:first-child{border:0;padding-top:0}
.sentlist .it{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.sentlist .it:first-child{border:0}
.sentlist .it small{color:var(--faint);display:block}

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), app = $('#app'), root = document.documentElement;
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d } catch { return d } }, set(k, v){ try { localStorage.setItem(k, v) } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post = (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b || {})});
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const map = { open:false, ready:false, nodes:[], links:[], view:{x:0,y:0,k:1}, hover:null, sel:null, q:'' };
function md(s){
  let h = esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  let out = '', list = false;
  for (const l of h.split('\n')){
    const m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m){ if (!list){ out += '<ul>'; list = true } out += `<li>${m[1]}</li>`; continue }
    if (list){ out += '</ul>'; list = false }
    if (l.trim()) out += `<p>${l}</p>`;
  }
  return out + (list ? '</ul>' : '');
}
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2600); }
function scroll(){ log.scrollTop = log.scrollHeight }
function el(cls, html){ const d = document.createElement('div'); d.className = cls; d.innerHTML = html; log.appendChild(d); app.classList.add('chatting'); scroll(); return d; }

/* ---------- themes ---------- */
const THEMES = ['gold','neon','aurora','frost','matrix','sunset'];
let palette = {};
function readTheme(){
  const split = v => css(v).split(/\s+/);
  palette = { idle: split('--orb-idle'), listening: split('--orb-listen'), thinking: split('--orb-think'), speaking: split('--orb-speak'),
              particle: css('--particle'), glow1: css('--glow1'), glow2: css('--glow2'), map: split('--map'), text: css('--text'), dim: css('--dim'), bg: css('--bg') };
}
function setTheme(t, quiet){
  root.dataset.theme = t; store.set('sahbi-theme', t); readTheme();
  document.querySelectorAll('.sw').forEach(s => s.classList.toggle('cur', s.dataset.t === t));
  if (map.ready) map.recolor();
  if (!quiet) toast('Theme: ' + css('--name').replace(/"/g,''));
}
(function buildPicker(){
  const box = $('#themes');
  for (const t of THEMES){
    const probe = document.createElement('div'); probe.dataset.theme = t; probe.style.display = 'none'; document.body.appendChild(probe);
    const cs = getComputedStyle(probe), g = n => cs.getPropertyValue(n).trim();
    const b = document.createElement('button'); b.className = 'sw'; b.dataset.t = t;
    const orb = g('--orb-idle').split(/\s+/);
    b.innerHTML = `<i style="background:radial-gradient(120% 120% at 20% 0%,${g('--glow1')},transparent 60%),radial-gradient(100% 100% at 100% 100%,${g('--glow2')},transparent 60%),${g('--bg')};
      --o:radial-gradient(circle at 35% 30%,${orb[0]},${orb[1]} 45%,${orb[2]});--og:${orb[1]}"></i>${g('--name').replace(/"/g,'')}`;
    b.onclick = () => setTheme(t);
    box.appendChild(b); probe.remove();
  }
})();
readTheme(); setTheme(root.dataset.theme, true);
$('#themeBtn').onclick = e => { e.stopPropagation(); $('#themes').classList.toggle('open'); $('#themeBtn').classList.toggle('active'); };
document.addEventListener('click', e => { if (!e.target.closest('#themes')){ $('#themes').classList.remove('open'); $('#themeBtn').classList.remove('active'); } });

/* ---------- orb ---------- */
let mode = 'idle', level = 0;
const STATUS = { idle:'Say <b>"Salam Sahbi"</b> — or tap the orb', listening:'Listening… <b>talk now</b>', thinking:'Thinking…', speaking:'Speaking…' };
function setMode(m){ mode = STATUS[m] ? m : 'idle'; $('#status').innerHTML = STATUS[mode]; $('#micBtn').classList.toggle('live', mode === 'listening'); }
const hex = h => h.length === 4 ? [1,2,3].map(i => parseInt(h[i]+h[i],16)) : [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lerp = (x,y,t) => x + (y - x) * t;
const cur = { a:[255,216,146], b:[240,180,76], c:[122,67,6] };
const oc = $('#orb'), ox = oc.getContext('2d'); const t0 = performance.now();
function drawOrb(now){
  const t = (now - t0) / 1000, W = oc.width, R = W * .26, cx = W/2, cy = W/2;
  const p = palette[mode] || palette.idle;
  ['a','b','c'].forEach((k,i) => { const h = hex(p[i] || '#ffffff'); cur[k] = cur[k].map((v,j) => lerp(v, h[j], .06)); });
  const target = mode === 'speaking' ? .55 + .45*Math.abs(Math.sin(t*9)*Math.sin(t*3.3)) : mode === 'listening' ? .35 + .25*Math.sin(t*5) : mode === 'thinking' ? .25 : .08;
  level = lerp(level, target, .12);
  ox.clearRect(0,0,W,W);
  const rgb = (c,a) => `rgba(${c.map(Math.round).join(',')},${a})`;
  let g = ox.createRadialGradient(cx,cy,R*.6,cx,cy,R*1.9); g.addColorStop(0, rgb(cur.b,.35 + level*.3)); g.addColorStop(1, rgb(cur.b,0));
  ox.fillStyle = g; ox.beginPath(); ox.arc(cx,cy,R*1.9,0,7); ox.fill();
  for (let k = 0; k < 3; k++){
    ox.beginPath();
    for (let i = 0; i <= 120; i++){
      const a = i/120*Math.PI*2, wob = Math.sin(a*(3+k) + t*(1.2+k*.5)*(mode==='thinking'?2.5:1)) * (4 + level*18) + Math.sin(a*7 - t*2) * level*6;
      const r = R*(1.18 + k*.13) + wob; const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      i ? ox.lineTo(x,y) : ox.moveTo(x,y);
    }
    ox.strokeStyle = rgb(cur.b, .32 - k*.08); ox.lineWidth = 2; ox.stroke();
  }
  const pulse = 1 + level*.08 + Math.sin(t*1.6)*.012;
  g = ox.createRadialGradient(cx - R*.35, cy - R*.4, R*.05, cx, cy, R*pulse);
  g.addColorStop(0, rgb(cur.a,1)); g.addColorStop(.45, rgb(cur.b,1)); g.addColorStop(1, rgb(cur.c,1));
  ox.fillStyle = g; ox.beginPath(); ox.arc(cx,cy,R*pulse,0,7); ox.fill();
  ox.save(); ox.beginPath(); ox.arc(cx,cy,R*pulse,0,7); ox.clip();
  for (let i = 0; i < 3; i++){
    ox.beginPath(); const ang = t*(.6+i*.25) + i*2;
    ox.ellipse(cx + Math.cos(ang)*R*.25, cy + Math.sin(ang)*R*.2, R*.9, R*.22, ang, 0, 7);
    ox.fillStyle = rgb(cur.a, .07 + level*.05); ox.fill();
  }
  ox.restore();
  requestAnimationFrame(drawOrb);
}
requestAnimationFrame(drawOrb);

/* ---------- background ---------- */
const bg = $('#bgfx'), bx = bg.getContext('2d'); let parts = [];
function sizeBg(){ bg.width = innerWidth*devicePixelRatio; bg.height = innerHeight*devicePixelRatio; parts = Array.from({length: Math.min(70, innerWidth/18)}, () => ({x:Math.random()*bg.width, y:Math.random()*bg.height, r:Math.random()*1.6+.3, v:Math.random()*.25+.05, o:Math.random()*.5+.1})); }
sizeBg(); addEventListener('resize', sizeBg);
(function drawBg(){
  const W = bg.width, H = bg.height; bx.clearRect(0,0,W,H);
  let g = bx.createRadialGradient(W*.32,-H*.1,0,W*.32,-H*.1,H*1.1); g.addColorStop(0, palette.glow1); g.addColorStop(1,'rgba(0,0,0,0)'); bx.fillStyle = g; bx.fillRect(0,0,W,H);
  g = bx.createRadialGradient(W*.9,H*1.05,0,W*.9,H*1.05,H*.9); g.addColorStop(0, palette.glow2); g.addColorStop(1,'rgba(0,0,0,0)'); bx.fillStyle = g; bx.fillRect(0,0,W,H);
  for (const p of parts){ p.y -= p.v*devicePixelRatio; if (p.y < -5){ p.y = H + 5; p.x = Math.random()*W } bx.beginPath(); bx.arc(p.x,p.y,p.r*devicePixelRatio,0,7); bx.fillStyle = `rgba(${palette.particle},${p.o*.5})`; bx.fill(); }
  requestAnimationFrame(drawBg);
})();

/* ---------- voice toggle ---------- */
let speakOn = true;
const VOL_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const VOL_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
const paintVol = () => $('#voiceBtn').innerHTML = speakOn ? VOL_ON : VOL_OFF; paintVol();
$('#voiceBtn').onclick = async () => { const r = await (await post('/api/voice', {on: !speakOn})).json(); speakOn = r.on; paintVol(); toast(speakOn ? 'Voice on' : 'Voice off'); };

/* ---------- conversation events ---------- */
let streamEl = null, streamText = '', typingEl = null, pendingAct = null;
const ICON = { find_files:'🔎', search_my_documents:'📚', open_path:'📂', read_document:'📄', send_to_phone:'📱', notify_phone:'📲', open_website:'🌐', web_search:'🔍', open_app:'🚀', look_at_screen:'👁️', check_email:'📥', read_email:'📨', reply_email:'↩️', send_email:'✉️', cancel_email:'✋', find_jobs:'🧭', job_details:'📋', log_application:'📝', job_applications:'💼', live_stats:'📊', morning_brief:'🌅', reminder:'⏱️', remember:'🧠', forget:'🧹' };
const LABEL = { look_at_screen:'Looking at your screen…', search_my_documents:'Searching your documents…', check_email:'Checking Gmail…', find_jobs:'Searching job boards…', job_details:'Opening the offer…', read_email:'Reading the email…' };
function typing(on){ if (on && !typingEl){ typingEl = el('typing','<i></i><i></i><i></i>') } if (!on && typingEl){ typingEl.remove(); typingEl = null } }
function listCard(title, rows){ return el('list', `<div class="lh">${title}</div>` + rows.join('')); }

const mails = {};
function mailCard(m){
  const d = el('mail', `<div class="top"><span class="badge">Sending</span><span class="sp"></span><span class="to">to <b>${esc(m.to.join(', '))}</b></span></div>
    <div class="subj">${esc(m.subject)}</div><div class="body">${esc(m.body)}</div>
    ${m.files?.length ? `<div class="files">${m.files.map(f => `<span class="file">📎 ${esc(f)}</span>`).join('')}</div>` : ''}
    <div class="row"><span class="count">Sending in <b>${m.seconds}</b>s — say “cancel” to stop</span><span class="sp"></span><button class="btn danger">Cancel</button></div>
    <div class="bar"></div>`);
  d.querySelector('.bar').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}], {duration: m.seconds*1000, easing:'linear', fill:'forwards'});
  let left = m.seconds; const cnt = d.querySelector('.count b');
  d._iv = setInterval(() => { left = Math.max(0, left-1); if (cnt) cnt.textContent = left; }, 1000);
  d.querySelector('.btn').onclick = () => post('/api/cancel', {id: m.id});
  mails[m.id] = d;
}
function mailDone(id, cls, label, note){
  const d = mails[id]; if (!d) return;
  clearInterval(d._iv); d.classList.add(cls); d.querySelector('.badge').textContent = label;
  d.querySelector('.row').innerHTML = `<span class="count">${note}</span>`; d.querySelector('.bar')?.remove();
}

function connect(){
  const es = new EventSource('/api/events');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    switch (m.type){
      case 'hello':
        $('#cModel').classList.add('on'); $('#cModel span:last-child').textContent = m.model;
        $('#cMic').classList.toggle('on', !!m.mic); $('#cMic span:last-child').textContent = m.mic ? 'wake word on' : 'mic off';
        speakOn = m.voice !== false; paintVol(); break;
      case 'mic': $('#cMic').classList.toggle('on', m.on); $('#cMic span:last-child').textContent = m.on ? 'wake word on' : 'mic off'; break;
      case 'state': setMode(m.state); if (m.state === 'thinking') typing(true); break;
      case 'wake': toast('Salam Sahbi 👋'); closeMap(); break;
      case 'action_start': if (LABEL[m.tool]){ typing(false); pendingAct = el('act busy', `<span class="ic">${ICON[m.tool]}</span><span>${LABEL[m.tool]}</span>`); } break;
      case 'brief': el('brief', `<div class="lh">🌅 Daily brief</div>${md(m.text)}`); break;
      case 'reminder': el('brief', `<div class="lh">⏱️ Reminder</div>${esc(m.text)}`); toast('⏱️ ' + m.text); break;
      case 'inbox': if (m.messages?.length) listCard('📥 Inbox', m.messages.map(x => `<div class="li"><span class="n">${x.n}</span><div><b>${esc(x.from)}</b> <small>${esc(x.date)}</small><br>${esc(x.subject)}<small class="sn">${esc(x.snippet.slice(0,110))}</small></div></div>`)); break;
      case 'jobs': if (m.jobs?.length) listCard('🧭 Job offers', m.jobs.map(j => `<a class="li" href="${esc(j.url)}" target="_blank" rel="noopener"><span class="n">${j.n}</span><div><b>${esc(j.title)}</b><br><small>${esc(j.company || '')} · ${esc(j.site)}</small></div><span class="fit f${j.score >= 6 ? 'hi' : j.score >= 3 ? 'mid' : 'lo'}">${j.score}/10</span></a>`)); break;
      case 'heard': el('msg me', esc(m.text) + (m.source === 'voice' ? '<span class="voice">🎙</span>' : '')); typing(true); break;
      case 'stream_start': streamText = ''; break;
      case 'delta': typing(false); if (!streamEl) streamEl = el('msg ai caret', ''); streamText += m.text; streamEl.innerHTML = md(streamText); scroll(); break;
      case 'stream_drop': if (streamEl){ streamEl.remove(); streamEl = null } streamText = ''; typing(true); break;
      case 'action':
        typing(false); if (pendingAct){ pendingAct.remove(); pendingAct = null }
        el('act', `<span class="ic">${ICON[m.tool] || '⚙️'}</span><b>${esc(m.tool.replace(/_/g,' '))}</b><span>${esc((String(m.result).split('\n').find(l => l.trim() && !l.startsWith('[')) || '').slice(0,140))}</span>`);
        typing(true);
        if (m.tool === 'remember' || m.tool === 'forget') loadMem();
        break;
      case 'reply':
        typing(false);
        if (streamEl){ streamEl.classList.remove('caret'); streamEl.innerHTML = md(m.text); streamEl = null }
        else el('msg ai', md(m.text));
        break;
      case 'email_pending': mailCard(m); break;
      case 'email_sent': mailDone(m.id, 'sent', 'Sent ✓', 'Delivered from your Gmail · copy in Sent'); toast('Email sent ✓'); loadMail(); break;
      case 'email_failed': mailDone(m.id, 'failed', 'Failed', esc(m.error || 'error')); toast('Email failed'); break;
      case 'email_cancelled': mailDone(m.id, 'cancelled', 'Cancelled', 'Nothing was sent'); toast('Cancelled'); break;
    }
  };
  es.onerror = () => { $('#cMic').classList.remove('on'); $('#cMic span:last-child').textContent = 'reconnecting…'; };
}
connect();

$('#f').onsubmit = e => { e.preventDefault(); const v = $('#t').value; $('#t').value = ''; send(v); };

/* ======================= BUBBLE MAP: linked, draggable, enter / back ======================= */
const mc = $('#mapc'), mx = mc.getContext('2d');
const EXT = { pdf:'PDF', docx:'Word', pptx:'PowerPoint', ipynb:'Notebook', md:'Markdown', txt:'Text' };
Object.assign(map, { data:null, stack:[], links:[], alpha:1, fade:1, drag:null, view:{x:0,y:0,k:1}, q:'' });
const colorOf = c => c === 'mem' ? css('--accent') : (palette.map[c % palette.map.length] || '#888888');
const rgbaOf = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const sub = t => $('#mapSub').textContent = t;

function openMap(){
  map.open = true; $('#mapview').classList.add('open'); $('#mapBtn').classList.add('active'); sizeMap();
  if (!map.data) loadMap(); else fitMap(true);
}
function closeMap(){ if (!map.open) return; map.open = false; $('#mapview').classList.remove('open'); $('#mapBtn').classList.remove('active'); closeInfo(); }
$('#mapBtn').onclick = () => map.open ? closeMap() : openMap();
$('#mapClose').onclick = closeMap; $('#memMap').onclick = openMap;
$('#mapFit').onclick = () => fitMap(true);
$('#mapBack').onclick = () => back();
$('#mapMode').querySelectorAll('button').forEach(b => b.onclick = () => go({ type: b.dataset.m }, true));

function sizeMap(){
  const r = mc.getBoundingClientRect(), d = devicePixelRatio || 1;
  mc.width = Math.max(1, r.width * d); mc.height = Math.max(1, r.height * d); map.W = r.width; map.H = r.height; map.d = d;
}
addEventListener('resize', () => { if (map.open) sizeMap(); });

async function loadMap(){
  sub('reading your index…');
  try { map.data = await (await fetch('/api/map')).json(); } catch { sub('could not load the map'); return; }
  map.ready = true;
  map.recolor = () => legend();
  const u = new URLSearchParams(location.search);          // ?view=all  ?topic=AI Content  ?doc=screenplay
  go({ type: u.get('view') === 'all' ? 'all' : 'topics' }, true);
  const tq = (u.get('topic') || '').toLowerCase(), dq = (u.get('doc') || '').toLowerCase();
  const c = tq && map.data.clusters.find(c => c.label.toLowerCase().includes(tq));
  if (c) go({ type:'topic', id:c.id });
  const n = dq && map.data.nodes.find(n => n.name.toLowerCase().includes(dq));
  if (n) go({ type:'doc', path:n.path });
}

/* ---------- levels ---------- */
function go(lv, reset){ if (reset) map.stack = [lv]; else map.stack.push(lv); render(lv); }
function back(){ if (map.stack.length > 1){ map.stack.pop(); render(map.stack[map.stack.length - 1]); } }
function enter(n){
  if (!n) return;
  if (n.kind === 'topic') go({ type:'topic', id:n.id });
  else if (n.kind === 'memhub') go({ type:'memory' });
  else if (n.kind === 'doc' && !n.center) go({ type:'doc', path:n.path });
  else if (n.kind === 'doc' && n.center) post('/api/open', {path:n.path}).then(() => toast('Opening ' + n.label));
  else select(n);
}

async function render(lv){
  closeInfo(); map.hover = map.sel = null;
  const D = map.data; let nodes = [], links = [];
  if (lv.type === 'topics'){
    nodes = D.clusters.map(c => ({ kind:'topic', id:c.id, label:c.label, sub:`${c.count} docs`, cluster:c.id, count:c.count, r: 30 + Math.sqrt(c.count) * 5.5 }));
    if (D.memory?.length) nodes.push({ kind:'memhub', id:'mem', label:'Memory', sub:`${D.memory.length} facts`, cluster:'mem', r: 26 + Math.sqrt(D.memory.length) * 4 });
    const at = Object.fromEntries(nodes.map(n => [n.id, n]));
    links = D.topic_links.filter(l => at[l.a] && at[l.b]).map(l => ({ s:at[l.a], t:at[l.b], w:l.w }));
    lv.label = 'Topics';
  } else if (lv.type === 'all' || lv.type === 'topic'){
    const all = lv.type === 'all', byIdx = {};
    D.nodes.forEach((n, i) => {
      if (!all && n.cluster !== lv.id) return;
      byIdx[i] = { kind:'doc', label:n.name, path:n.path, rel:n.rel, ext:n.ext, size:n.size, cluster:n.cluster,
                   r: (all ? 4 : 7) + Math.min(all ? 14 : 22, Math.sqrt(n.size) * (all ? 1.6 : 2.7)) };
    });
    nodes = Object.values(byIdx);
    links = D.links.filter(l => byIdx[l.a] && byIdx[l.b]).map(l => ({ s:byIdx[l.a], t:byIdx[l.b], w:l.w }));
    lv.label = all ? 'All documents' : (D.clusters.find(c => c.id === lv.id) || {}).label;
  } else if (lv.type === 'memory'){
    nodes = (D.memory || []).map(m => ({ kind:'mem', label:m.fact, fact:m.fact, added:m.added, cluster:'mem', r:16 }));
    lv.label = 'Memory';
  } else if (lv.type === 'doc'){
    sub('opening…');
    let d;
    try { d = await (await fetch('/api/map/doc?path=' + encodeURIComponent(lv.path))).json(); } catch { d = { error:true }; }
    if (d.error){ toast('That file is not in the index'); map.stack.pop(); return render(map.stack[map.stack.length - 1]); }
    const n = d.node;
    const center = { kind:'doc', center:true, label:n.name, path:n.path, rel:n.rel, ext:n.ext, size:n.size, cluster:n.cluster, r:48, fx:0, fy:0 };
    nodes = [center];
    d.parts.forEach((t, k) => { const p = { kind:'part', label:`Section ${k + 1}`, text:t, doc:n.name, path:n.path, cluster:n.cluster, r: 7 + Math.min(5, t.length / 220) }; nodes.push(p); links.push({ s:center, t:p, w:.3, short:true }); });
    d.related.forEach(r => { const o = { kind:'doc', label:r.name, path:r.path, rel:r.rel, ext:r.ext, size:r.size, cluster:r.cluster, sim:r.w, r: 12 + Math.min(16, Math.sqrt(r.size) * 2) }; nodes.push(o); links.push({ s:center, t:o, w: Math.max(.08, (r.w - .75) / .25) }); });
    lv.label = n.name; lv.detail = d;
  }
  for (const n of nodes) n.nb = new Map();
  for (const l of links){ l.s.nb.set(l.t, l.w); l.t.nb.set(l.s, l.w); }
  nodes.forEach((n, k) => { const a = k * 2.399963, rr = 8 + Math.sqrt(k) * 16; n.x = n.fx ?? Math.cos(a) * rr; n.y = n.fy ?? Math.sin(a) * rr; n.vx = n.vy = 0; n.ph = Math.random() * 6.283; });
  map.nodes = nodes; map.links = links; map.alpha = 1; map.level = lv;
  for (let i = 0; i < 260; i++) tick();
  map.alpha = .25; map.fade = 0;
  fitMap(true, .55);
  crumbs(); legend();
  $('#mapMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === map.stack[0].type));
  const L = links.length;
  sub(lv.type === 'topics' ? `${D.clusters.length} topics · ${D.nodes.length} documents · ${D.links.length} links — double-click a topic to enter`
    : lv.type === 'all' ? `${nodes.length} documents · ${L} links between similar documents`
    : lv.type === 'topic' ? `${nodes.length} documents · ${L} links — drag them, double-click one to enter`
    : lv.type === 'memory' ? `${nodes.length} things Sahbi remembers`
    : `${EXT[lv.detail.node.ext] || lv.detail.node.ext} · ${lv.detail.node.size} passages · ${lv.detail.parts.length} sections · ${lv.detail.related.length} related documents`);
}

function crumbs(){
  const box = $('#crumbs');
  box.innerHTML = map.stack.map((lv, i) => (i ? '<span class="sep">›</span>' : '') +
    `<button data-i="${i}" class="${i === map.stack.length - 1 ? 'cur' : ''}" title="${esc(lv.label)}">${esc(lv.label || '…')}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i < map.stack.length - 1){ map.stack.length = i + 1; render(map.stack[i]); } });
  $('#mapBack').style.visibility = map.stack.length > 1 ? 'visible' : 'hidden';
}

function legend(){
  if (!map.data || !map.level) return;
  const lv = map.level, D = map.data, box = $('#legend');
  if (lv.type === 'topics' || lv.type === 'all'){
    box.innerHTML = D.clusters.map(c => `<button data-c="${c.id}"><i style="background:${colorOf(c.id)};box-shadow:0 0 8px ${colorOf(c.id)}"></i>${esc(c.label)} <span style="opacity:.6">${c.count}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => go({ type:'topic', id:+b.dataset.c }));
  } else if (lv.type === 'doc'){
    const seen = [...new Set(map.nodes.filter(n => n.kind === 'doc' && !n.center).map(n => n.cluster))];
    box.innerHTML = `<span class="tag"><i style="background:${colorOf(lv.detail.node.cluster)}"></i>small = sections of this document</span>`
      + seen.map(c => `<span class="tag"><i style="background:${colorOf(c)}"></i>${esc((D.clusters.find(x => x.id === c) || {}).label)}</span>`).join('');
  } else {
    const c = lv.type === 'memory' ? 'mem' : lv.id;
    box.innerHTML = `<span class="tag"><i style="background:${colorOf(c)}"></i>${esc(lv.label)} · ${map.nodes.length}</span>`;
  }
}

/* ---------- physics (force-directed, like a holders bubble map) ---------- */
function tick(){
  const N = map.nodes, a = map.alpha;
  if (a < .003 && !map.drag) return;
  for (let i = 0; i < N.length; i++){
    const p = N[i];
    for (let j = i + 1; j < N.length; j++){
      const q = N[j]; let dx = q.x - p.x, dy = q.y - p.y;
      if (dx > 500 || dx < -500 || dy > 500 || dy < -500) continue;
      const d2 = dx * dx + dy * dy || .01, d = Math.sqrt(d2), min = p.r + q.r + 6;
      const f = Math.min(6, 900 * (p.r + q.r) / 30 / d2) * a;          // everyone pushes everyone a little
      const fx = dx / d * f, fy = dy / d * f;
      p.vx -= fx; p.vy -= fy; q.vx += fx; q.vy += fy;
      if (d < min){                                                     // never overlap
        const push = (min - d) / d * .5; dx *= push; dy *= push;
        p.x -= dx; p.y -= dy; q.x += dx; q.y += dy;
      }
    }
  }
  for (const l of map.links){                                           // links act like springs
    const p = l.s, q = l.t, dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || .01;
    const L = p.r + q.r + (l.short ? 22 : 40 + (1 - l.w) * 110);
    const f = (d - L) / d * .05 * a * (l.short ? 1.4 : .6 + l.w);
    p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f;
  }
  for (const n of N){
    n.vx -= n.x * .0035 * a; n.vy -= n.y * .0035 * a;                  // gentle pull to the middle
    if (n.fx != null){ n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; continue; }
    n.vx *= .62; n.vy *= .62; n.x += n.vx; n.y += n.vy;
  }
  map.alpha = Math.max(map.drag ? .3 : 0, a * .985);
}

function fitMap(anim, fromScale){
  if (!map.nodes.length || !map.W) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n of map.nodes){ x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r); x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r + 16); }
  const top = 84, bottom = 70;
  const k = Math.min((map.W - 80) / (x1 - x0 || 1), (map.H - top - bottom) / (y1 - y0 || 1), 2.4);
  const target = { k, x: map.W / 2 - (x0 + x1) / 2 * k, y: top + (map.H - top - bottom) / 2 - (y0 + y1) / 2 * k };
  if (fromScale){ const k0 = k * fromScale; map.view = { k:k0, x: map.W / 2 - (x0 + x1) / 2 * k0, y: target.y + ((y0 + y1) / 2) * (k - k0) }; }
  if (!anim){ map.view = target; return; }
  const from = {...map.view}, t0 = performance.now();
  (function tk(now){ const t = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - t, 3);
    map.view = { k: lerp(from.k, target.k, e), x: lerp(from.x, target.x, e), y: lerp(from.y, target.y, e) };
    if (t < 1) requestAnimationFrame(tk); })(t0);
}
function zoomTo(wx, wy, k){
  const from = {...map.view}, target = { k, x: map.W / 2 - wx * k, y: map.H / 2 - wy * k }, t0 = performance.now();
  (function tk(now){ const t = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - t, 3);
    map.view = { k: lerp(from.k, target.k, e), x: lerp(from.x, target.x, e), y: lerp(from.y, target.y, e) };
    if (t < 1) requestAnimationFrame(tk); })(t0);
}
const toWorld = (sx, sy) => ({ x: (sx - map.view.x) / map.view.k, y: (sy - map.view.y) / map.view.k });
function hit(sx, sy){
  const p = toWorld(sx, sy);
  for (let i = map.nodes.length - 1; i >= 0; i--){ const n = map.nodes[i]; if (Math.hypot(n.x - p.x, n.y - p.y) < n.r + 3 / map.view.k) return n; }
  return null;
}
function wrap(text, maxW, maxLines){
  const words = String(text).replace(/[_-]+/g, ' ').split(/\s+/), lines = []; let cur = '';
  for (const w of words){ const t = cur ? cur + ' ' + w : w; if (mx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){ lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.{0,2}$/, '…'); }
  return lines;
}

/* ---------- drawing ---------- */
function drawMap(now){
  requestAnimationFrame(drawMap);
  if (!map.open || !map.nodes || !map.nodes.length) return;
  tick();
  map.fade = Math.min(1, map.fade + .05);
  const t = now / 1000, { d, W, H } = map, v = map.view, q = map.q, F = map.fade;
  const focus = map.hover || map.sel;
  mx.setTransform(d, 0, 0, d, 0, 0); mx.clearRect(0, 0, W, H);
  mx.setTransform(d * v.k, 0, 0, d * v.k, d * v.x, d * v.y);
  const matches = n => !q || (n.label + ' ' + (n.rel || '') + ' ' + (n.text || '')).toLowerCase().includes(q);

  // links
  for (const l of map.links){
    const on = focus && (l.s === focus || l.t === focus);
    const a = (on ? .9 : focus ? .05 : (l.short ? .18 : .1 + l.w * .35)) * F * (q && !(matches(l.s) && matches(l.t)) ? .3 : 1);
    if (a < .01) continue;
    const col = colorOf((on ? focus : l.s).cluster);
    mx.strokeStyle = rgbaOf(col, a); mx.lineWidth = (on ? 2.2 : .7 + l.w * 1.8) / v.k;
    if (on){ mx.setLineDash([7 / v.k, 7 / v.k]); mx.lineDashOffset = -t * 30 / v.k; }
    const mxp = (l.s.x + l.t.x) / 2 + (l.t.y - l.s.y) * .08, myp = (l.s.y + l.t.y) / 2 - (l.t.x - l.s.x) * .08;   // slight curve
    mx.beginPath(); mx.moveTo(l.s.x, l.s.y); mx.quadraticCurveTo(mxp, myp, l.t.x, l.t.y); mx.stroke();
    mx.setLineDash([]);
  }
  // bubbles
  for (const n of map.nodes){
    const hot = n === map.hover || n === map.sel, near = focus && focus.nb.has(n);
    const dim = (focus && !hot && !near) || (q && !matches(n));
    const bob = n.fx != null || n === map.drag?.node ? 0 : Math.sin(t * 1.1 + n.ph) * .9;
    const x = n.x, y = n.y + bob, r = n.r * (hot ? 1.08 : 1), col = colorOf(n.cluster);
    mx.globalAlpha = (dim ? .16 : 1) * F;
    if (hot || near){ mx.shadowColor = col; mx.shadowBlur = hot ? 30 : 14; }
    const g = mx.createRadialGradient(x - r * .35, y - r * .42, r * .08, x, y, r);
    g.addColorStop(0, rgbaOf('#ffffff', .9)); g.addColorStop(.16, rgbaOf(col, .95)); g.addColorStop(.75, rgbaOf(col, .62)); g.addColorStop(1, rgbaOf(col, .38));
    mx.fillStyle = g; mx.beginPath(); mx.arc(x, y, r, 0, 7); mx.fill(); mx.shadowBlur = 0;
    mx.strokeStyle = rgbaOf(hot ? '#ffffff' : col, hot ? .95 : .6); mx.lineWidth = (hot ? 2.2 : 1) / v.k; mx.stroke();
    if (n.center){ mx.strokeStyle = rgbaOf(col, .35); mx.lineWidth = 1.5 / v.k; mx.setLineDash([3 / v.k, 6 / v.k]); mx.beginPath(); mx.arc(x, y, r + 9 + Math.sin(t * 2) * 2, 0, 7); mx.stroke(); mx.setLineDash([]); }
    // text
    const big = n.kind === 'topic' || n.kind === 'memhub' || n.center;
    if (big && r * v.k > 26){
      const fs = Math.max(8, Math.min(r * .27, 22));
      mx.font = `700 ${fs}px ${css('--display')}`; mx.textAlign = 'center'; mx.textBaseline = 'middle';
      const lines = wrap(n.label, r * 1.55, 3), lh = fs * 1.12, y0 = y - (lines.length - 1) * lh / 2 - (n.sub ? fs * .35 : 0);
      mx.fillStyle = '#ffffff'; mx.shadowColor = rgbaOf('#000000', .55); mx.shadowBlur = 6;
      lines.forEach((s, i) => mx.fillText(s, x, y0 + i * lh));
      if (n.sub){ mx.font = `600 ${fs * .62}px ${css('--font')}`; mx.globalAlpha *= .85; mx.fillText(n.sub, x, y0 + lines.length * lh + fs * .05); }
      mx.shadowBlur = 0;
    } else if (n.kind !== 'part' && (r * v.k > 17 || hot || near || (q && matches(n)))){
      mx.font = `600 ${11.5 / v.k}px ${css('--font')}`; mx.textAlign = 'center'; mx.textBaseline = 'top';
      const name = n.label.length > 26 ? n.label.slice(0, 24) + '…' : n.label;
      mx.fillStyle = palette.text; mx.globalAlpha *= hot ? 1 : .8; mx.fillText(name, x, y + r + 4 / v.k);
    } else if (n.kind === 'mem' && r * v.k > 10){
      mx.font = `${r}px sans-serif`; mx.textAlign = 'center'; mx.textBaseline = 'middle'; mx.fillText('🧠', x, y + 1);
    }
    mx.globalAlpha = 1;
  }
}
requestAnimationFrame(drawMap);

/* ---------- interaction: drag bubbles, pan, zoom, click, double-click ---------- */
mc.addEventListener('wheel', e => {
  e.preventDefault();
  const r = mc.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top, w = toWorld(sx, sy);
  const k = Math.max(.15, Math.min(6, map.view.k * Math.exp(-e.deltaY * .0015)));
  map.view = { k, x: sx - w.x * k, y: sy - w.y * k };
}, { passive:false });
mc.addEventListener('pointerdown', e => {
  const r = mc.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top, n = hit(sx, sy);
  map.drag = { node:n, x:e.clientX, y:e.clientY, vx:map.view.x, vy:map.view.y, moved:false, wasFixed: n && n.fx != null };
  mc.setPointerCapture(e.pointerId);
});
mc.addEventListener('pointermove', e => {
  const r = mc.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top, g = map.drag;
  if (g){
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (Math.abs(dx) + Math.abs(dy) > 4){ g.moved = true; mc.classList.add('drag'); }
    if (g.moved && g.node){ const w = toWorld(sx, sy); g.node.fx = w.x; g.node.fy = w.y; map.alpha = Math.max(map.alpha, .35); }
    else if (g.moved){ map.view.x = g.vx + dx; map.view.y = g.vy + dy; }
    $('#mtip').style.opacity = 0;
    return;
  }
  const n = hit(sx, sy); map.hover = n; mc.style.cursor = n ? 'pointer' : 'grab';
  const tip = $('#mtip');
  if (n){
    tip.textContent = n.kind === 'topic' ? `${n.label} · ${n.count} documents · double-click to enter`
      : n.kind === 'part' ? `${n.label}: ${n.text.slice(0, 90)}…`
      : n.kind === 'mem' ? '🧠 ' + n.fact : n.kind === 'memhub' ? 'Memory · double-click to enter'
      : `${n.label} · ${EXT[n.ext] || n.ext}${n.sim ? ` · ${Math.round(n.sim * 100)}% similar` : ''}`;
    tip.style.left = Math.min(sx + 14, map.W - 240) + 'px'; tip.style.top = (sy + 10) + 'px'; tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});
mc.addEventListener('pointerup', e => {
  mc.classList.remove('drag');
  const g = map.drag; map.drag = null;
  if (!g) return;
  if (g.node && g.moved){ if (!g.wasFixed){ delete g.node.fx; delete g.node.fy; } return; }   // let it float back into place
  if (!g.moved) select(g.node);
});
mc.addEventListener('dblclick', e => { const r = mc.getBoundingClientRect(); enter(hit(e.clientX - r.left, e.clientY - r.top)); });
$('#mapQ').addEventListener('input', e => { map.q = e.target.value.trim().toLowerCase(); });
$('#mapQ').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !map.q) return;
  const here = map.nodes.find(n => n.kind === 'doc' && (n.label + ' ' + (n.rel || '')).toLowerCase().includes(map.q));
  if (here && map.level.type !== 'topics'){ select(here); zoomTo(here.x, here.y, Math.max(map.view.k, 1.6)); return; }
  const n = map.data.nodes.find(n => (n.name + ' ' + n.rel).toLowerCase().includes(map.q));
  if (n){ go({ type:'doc', path:n.path }); e.target.value = ''; map.q = ''; } else toast('No document matches');
});

/* ---------- info panel ---------- */
function closeInfo(){ $('#minfo').classList.remove('open'); }
function select(n){
  map.sel = n; const box = $('#minfo');
  if (!n){ closeInfo(); return; }
  const col = colorOf(n.cluster);
  const conns = [...n.nb.entries()].filter(([o]) => o.kind !== 'part').sort((a, b) => b[1] - a[1]).slice(0, 12);
  const connHtml = conns.length ? `<div class="conn"><div class="lh">Connected to ${conns.length}</div>${conns.map(([o, w], i) =>
      `<a data-i="${i}"><i style="background:${colorOf(o.cluster)}"></i><span>${esc(o.label)}</span><small>${o.sim ? Math.round(o.sim * 100) + '%' : '●'.repeat(1 + Math.round(w * 3))}</small></a>`).join('')}</div>` : '';
  let html = '';
  if (n.kind === 'topic' || n.kind === 'memhub'){
    html = `<div class="lh" style="color:${col}">Topic</div><h5>${esc(n.label)}</h5><div class="meta">${esc(n.sub)}</div>
      <div class="row"><button class="btn primary" id="miEnter">Enter ↵</button><button class="btn" id="miClose">×</button></div>${connHtml}`;
  } else if (n.kind === 'doc'){
    html = `<div class="lh" style="color:${col}">${esc((map.data.clusters.find(c => c.id === n.cluster) || {}).label || '')}</div><h5>${esc(n.label)}</h5>
      <div class="meta">${esc(EXT[n.ext] || n.ext)} · ${n.size} passages${n.sim ? ` · ${Math.round(n.sim * 100)}% similar` : ''}<br>${esc(n.rel)}</div>
      <div class="row">${n.center ? '' : '<button class="btn primary" id="miEnter">Enter ↵</button>'}<button class="btn${n.center ? ' primary' : ''}" id="miOpen">Open</button><button class="btn" id="miAsk">Ask Sahbi</button><button class="btn" id="miClose">×</button></div>${connHtml}`;
  } else if (n.kind === 'part'){
    html = `<div class="lh" style="color:${col}">${esc(n.label)} · ${esc(n.doc)}</div><div class="txt">${esc(n.text)}</div>
      <div class="row"><button class="btn primary" id="miAsk">Explain this part</button><button class="btn" id="miClose">×</button></div>`;
  } else if (n.kind === 'mem'){
    html = `<div class="lh">🧠 Memory</div><h5>${esc(n.fact)}</h5><div class="meta">saved ${esc(n.added)}</div>
      <div class="row"><button class="btn danger" id="miForget">Forget</button><button class="btn" id="miClose">×</button></div>`;
  }
  box.innerHTML = html; box.classList.add('open');
  const on = (id, f) => { const b = box.querySelector('#' + id); if (b) b.onclick = f; };
  on('miClose', () => { closeInfo(); map.sel = null; });
  on('miEnter', () => enter(n));
  on('miOpen', () => post('/api/open', {path:n.path}).then(() => toast('Opening ' + n.label)));
  on('miAsk', () => send(n.kind === 'part'
    ? `In the document "${n.doc}", explain this part simply: ${n.text.slice(0, 600)}`
    : `Read the document ${n.path} and summarize it in 3 short points.`));
  on('miForget', async () => { await post('/api/memory/forget', {text:n.fact}); toast('Forgotten'); map.data = null; loadMem(); loadMap(); });
  box.querySelectorAll('.conn a').forEach(a => {
    const o = conns[+a.dataset.i][0];
    a.onclick = () => { select(o); zoomTo(o.x, o.y, Math.max(map.view.k, 1.2)); };
    a.ondblclick = () => enter(o);
  });
}
addEventListener('keydown', e => {
  if (!map.open || e.target.matches('input')) return;
  if (e.key === 'Backspace'){ e.preventDefault(); back(); }
  if (e.key.toLowerCase() === 'f') fitMap(true);
  if (e.key === 'Enter' && map.sel) enter(map.sel);
});

/* ---------- side cards ---------- */
const arrow = v => v == null ? '' : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v).toFixed(2)}%</span>`;
async function stats(){
  try {
    const d = await (await fetch('/api/status')).json();
    $('#wxT').textContent = d.tempC != null ? d.tempC + '°' : '--°';
    $('#wxS').innerHTML = d.city ? `${esc(d.city)}<br>${esc(d.sky || '')}` : '';
    $('#markets').innerHTML = d.gold ? `<div class="kv"><span>Gold</span><span>$${Number(d.gold).toLocaleString()} ${arrow(d.goldChg)}</span></div><div class="kv"><span>Bitcoin</span><span>$${Number(d.btc||0).toLocaleString()} ${arrow(d.btcChg)}</span></div>` : '<div class="foot">no data</div>';
    const bat = parseInt(d.battery) || 0, gpu = String(d.gpu||'').split(',');
    $('#pc').innerHTML = `<div class="kv"><span>Battery</span><span>${esc(d.battery || '-')}</span></div><div class="meter"><i style="width:${bat}%"></i></div>
      <div class="kv" style="margin-top:8px"><span>GPU</span><span>${gpu[0] ? gpu[0].trim() + '°C · ' + (gpu[1]||'').trim() : '-'}</span></div>
      <div class="kv"><span>Disk free</span><span>${d.disk_free_gb} GB</span></div>`;
    $('#news').innerHTML = (d.news || []).slice(0,5).map(n => `<li>${esc(n)}</li>`).join('');
  } catch {}
}
async function loadMail(){
  try {
    const d = await (await fetch('/api/emails')).json();
    $('#cMail').classList.toggle('on', d.ready); $('#cMail').classList.toggle('warn', !d.ready);
    $('#cMail span:last-child').textContent = d.ready ? 'email ready' : 'email: setup';
    $('#mailSide').innerHTML = !d.ready
      ? `<div class="setup">To let Sahbi send emails, run <b>Setup Sahbi email.bat</b> once (in the sahbi folder) and paste a Gmail App Password.</div>`
      : d.sent.length ? d.sent.map(s => `<div class="it">${esc(s.subject)}<small>${esc(s.to.join(', '))} · ${esc(String(s.t).slice(5,16).replace('T',' '))}</small></div>`).join('')
      : `<div class="foot">Nothing sent yet · from ${esc(d.address)}</div>`;
  } catch {}
}
async function loadMem(){
  try {
    const d = await (await fetch('/api/memory')).json(), ix = d.index || {};
    const idx = ix.state === 'indexing' ? `Indexing documents… ${ix.done}/${ix.todo}` : ix.state === 'ready' ? `${ix.files} documents indexed` : 'Document index starts shortly';
    $('#mem').innerHTML = (d.items.length ? d.items.slice(0,5).map(i => `<div class="it">${esc(i.fact)}<small>${esc(i.added)}</small></div>`).join('') : '<div class="foot">Tell me "remember that…"</div>')
      + `<div class="foot" style="margin-top:8px">📚 ${idx}</div>`;
  } catch {}
}
function clock(){ const n = new Date(); $('#clock').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); $('#day').textContent = n.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }
clock(); setInterval(clock, 5000); stats(); setInterval(stats, 60000); loadMail(); loadMem(); setInterval(loadMem, 20000);
{ const u = new URLSearchParams(location.search);            // ?theme=neon  ?map
  if (THEMES.includes(u.get('theme'))) setTheme(u.get('theme'), true);
  if (u.has('map')) setTimeout(openMap, 400); }
setTimeout(() => { if (!log.children.length){ const h = new Date().getHours(); el('msg ai', md(`${h < 12 ? 'Good morning' : h < 18 ? 'Hey' : 'Good evening'}, sahbi! I'm here — talk to me in any language, I'll answer in English.`)); app.classList.remove('chatting'); } }, 300);
</script>
